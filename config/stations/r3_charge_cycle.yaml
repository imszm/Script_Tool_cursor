# R3 继电器充电压力测试（迁移自 Tool/继电器充电压力测试_R3.py）
#
# 用法：
#   ppx-test run r3_charge_cycle --port relay=COM3 --port device=COM4
#
# 流程与 l5_charge_cycle 相同，仅成功关键字不同（开始充电 / 充电完成语音）。
# 旧 R3 脚本同样每条继电器指令连发两次 -> relay.repeat: 2。
station: r3_charge_cycle
app: charge.charge_cycle
description: R3 继电器充电通断压力测试

serial:
  relay:
    baudrate: 9600
    timeout: 0.1
    match: { description_contains: [CH340] }
  device:
    baudrate: 115200
    timeout: 0.1
    encoding: utf-8
    encoding_errors: ignore
    match: { description_contains: [CP210] }

relay:
  type: command
  channels:
    1: { "on": 0x50, "off": 0x4F }   # YAML 中 on/off 须加引号，否则会被解析为布尔值
  repeat: 2
  repeat_gap_s: 0.05
  post_write_delay_s: 0.05
  drain_response: true

keywords:
  match_mode: normalized
  concat_buffer_max: 0
  success:
    - "voice_msg num: 1"
    - "voice_msg num: 2"
  exception:
    - assertionfailedatfunction
  rate_rules:
    - { keyword: paramisinvalid, window_s: 3.0, count: 3, severity: error, keep_power: false }

test:
  cycles: 500000
  relay_channel: 1
  charge_on_s: 25.0
  post_success_hold_s: 3.0
  off_reset_s: 10.0
  initial_off_s: 10.0
  flush_before_on: true
  reconnect_delay_s: 3.0
  stop_on_fail: false
  notify: true
