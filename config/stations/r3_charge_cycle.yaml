# R3 继电器充电压力测试
# 整合自单独优化的 继电器充电压力测试_R3.py：
#   * 设备大约每 100ms 输出一大批日志，后台线程按块读，不再逐行 readline；
#   * 先清空并打开判定，再吸合继电器，两次发令之间的日志不会落在空窗里；
#   * 关键字去掉全部空白后跨块拼接；voice_msg num: 1 不会误命中 num: 10；
#   * 扩大驱动接收缓冲，避免默认 4KB 在读线程稍慢时丢字节。
#
# 用法：
#   ppx-test run r3_charge_cycle --port relay=COM3 --port device=COM4
#   ppx-test run r3_charge_cycle --set test.cycles=2
include:
  - _fragments/relay_ch340.yaml
  - _fragments/relay_cmd_50_4f.yaml
  - _fragments/keywords_assertion.yaml

station: r3_charge_cycle
app: charge.charge_cycle
description: R3 继电器充电通断压力测试（高速日志按块读取）

serial:
  device:
    baudrate: 115200
    timeout: 0                 # 按 in_waiting 整段读，不再用 readline 每次取一行
    encoding: utf-8
    encoding_errors: ignore
    rx_buffer_sizes: [1048576, 262144, 65536]
    match: { description_contains: [CP210] }

relay:
  repeat: 2
  repeat_gap_s: 0.05
  post_write_delay_s: 0.05
  drain_response: true

keywords:
  match_mode: normalized
  concat_buffer_max: 0
  success:
    - "voice_msg num: 1"
    - "voice_msg num: 2"
  rate_rules:
    - { keyword: paramisinvalid, window_s: 3.0, count: 3, severity: error, keep_power: false }

test:
  listen: chunk
  success_digit_boundary: true
  chunk_read_bytes: 262144
  drain_grace_s: 0.05
  read_idle_s: 0.001
  cycles: 500000
  relay_channel: 1
  charge_on_s: 25.0
  post_success_hold_s: 3.0
  off_reset_s: 10.0
  initial_off_s: 10.0
  flush_before_on: true
  reconnect_delay_s: 3.0
  stop_on_fail: false
  notify: true
